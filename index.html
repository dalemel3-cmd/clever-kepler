<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails accessibility.
         Double-tap zoom on the kiosk is prevented with touch-action in styles.css,
         and inputs are 16px so iOS doesn't auto-zoom on focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HPD · Shiloh Christian Human Performance</title>
    <meta name="description" content="Shiloh Christian Human Performance dashboard: weigh-ins, sleep, session RPE, lifts and jump testing for S&amp;C staff." />
    <!-- Private, login-only staff tool: keep it out of search engines. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://clever-kepler.vercel.app/" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#030e20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HPD" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews when the URL is texted or posted to a coach. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shiloh Christian Human Performance" />
    <meta property="og:title" content="HPD · Shiloh Christian Human Performance" />
    <meta property="og:description" content="Weigh-ins, sleep, training load, lifts and jump testing for Shiloh Christian athletics." />
    <meta property="og:url" content="https://clever-kepler.vercel.app/" />
    <meta property="og:image" content="https://clever-kepler.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Human Performance, Shiloh Christian" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
    <!-- display=block: an icon font must not flash its ligature names ("chevron_left")
         as text while it loads. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">
    <noscript>HPD needs JavaScript turned on to run.</noscript>
    <!-- Static placeholder: React replaces it on mount, so a slow or failed start
         shows something other than a blank white page. -->
    <div id="root"><div id="hpd-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#030e20;color:#93a0b4;font:600 14px system-ui,sans-serif;letter-spacing:.05em">Loading HPD…</div></div>
    <script>
      // Startup safety net (v5.2.7). If the app hasn't mounted within 10s - a script
      // that failed to load or parse, or a service-worker update that left a stale
      // cached copy - show a way out instead of a stuck screen. Errors seen before
      // mount are kept in localStorage and sent to app_errors on the next good start.
      (function () {
        var errs = [];
        function remember(msg) {
          errs.push(String(msg).slice(0, 500));
          try { localStorage.setItem('hpd_boot_errors', JSON.stringify(errs.slice(-5))); } catch (e) {}
        }
        window.addEventListener('error', function (e) {
          if (window.__hpdMounted) return;
          var t = e.target;
          remember(t && t !== window && (t.src || t.href) ? 'Failed to load ' + (t.src || t.href) : (e.message || 'Script error'));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          if (!window.__hpdMounted) remember((e.reason && (e.reason.message || e.reason)) || 'Unhandled rejection');
        });
        window.__hpdHardReload = function () {
          var done = function () { location.reload(); };
          var jobs = [];
          try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
          try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          Promise.all(jobs).then(done, done);
        };
        setTimeout(function () {
          if (window.__hpdMounted) return;
          remember('App did not start within 10s');
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#030e20;color:#e8ecf2;font-family:system-ui,sans-serif">'
            + '<div style="max-width:420px;background:#0a1628;border:1px solid #1f3252;border-radius:16px;padding:28px">'
            + '<h1 style="margin:0 0 10px;font-size:22px;text-transform:uppercase">HPD didn\u2019t finish loading</h1>'
            + '<p style="margin:0 0 18px;color:#93a0b4;line-height:1.5">This usually happens right after an update. Reloading clears the old cached copy. Your data is safe.</p>'
            + '<button onclick="window.__hpdHardReload()" style="width:100%;height:44px;border:0;border-radius:10px;background:#b89c5b;color:#030a14;font-weight:700;font-size:15px">Reload</button>'
            + '</div></div>';
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
